<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Your Name through an accessible portfolio contact form.">
  <meta name="theme-color" content="#2563eb">
  <title>Contact | Your Name</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Your Name home">Your Name</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
        <span class="sr-only">Toggle navigation</span>☰
      </button>
      <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a aria-current="page" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="page-heading" aria-labelledby="page-title">
      <div class="container">
        <p class="eyebrow">Get in touch</p>
        <h1 id="page-title">Contact me</h1>
        <p class="lead">Use the form below to send a message.</p>
      </div>
    </section>

    <section class="section" aria-labelledby="form-title">
      <div class="container form-wrap">
        <div>
          <h2 id="form-title">Send a message</h2>
          <p>All fields marked with <span aria-hidden="true">*</span> are required.</p>
        </div>

        <form id="contact-form" action="#" method="post" novalidate>
          <div class="form-group">
            <label for="name">Full name <span aria-hidden="true">*</span></label>
            <input id="name" name="name" type="text" autocomplete="name" required aria-required="true">
            <p class="field-error" id="name-error"></p>
          </div>

          <div class="form-group">
            <label for="email">Email address <span aria-hidden="true">*</span></label>
            <input id="email" name="email" type="email" autocomplete="email" required aria-required="true">
            <p class="field-error" id="email-error"></p>
          </div>

          <div class="form-group">
            <label for="subject">Subject <span aria-hidden="true">*</span></label>
            <input id="subject" name="subject" type="text" required aria-required="true">
            <p class="field-error" id="subject-error"></p>
          </div>

          <div class="form-group">
            <label for="message">Message <span aria-hidden="true">*</span></label>
            <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
            <p class="field-error" id="message-error"></p>
          </div>

          <button class="button" type="submit">Send message</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Your Name. All rights reserved.</p>
      <nav aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="about.html">Projects</a>
        <a href="index.html">Home</a>
      </nav>
    </div>
  </footer>

  <script src="js/script.js" defer></script>
</body>
</html>
